name: Forgecy quality checks
on:
  push:
    branches:
      - feat/forgecy-v11-client-first-rebuild
      - feat/forgecy-v13-skills-quality-reliability
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Security/invariant tests
        run: npm test
      - name: SQL migrations and RLS smoke tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0001_init.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_invariants.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_knowledge_versions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_content_approval.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0005_editorial_intelligence.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0006_quality_gates.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0007_source_intelligence.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0008_ai_jobs.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0009_strategic_blueprints.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0010_editorial_calendar.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0011_client_evidence_search.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0012_website_crawl_budgets.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0013_source_chunks.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0014_source_chunks_backfill.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/smoke.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/knowledge.sql
      - name: Build
        run: npm run build
