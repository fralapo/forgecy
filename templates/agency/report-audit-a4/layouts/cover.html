<div class="frame cover">
  <img class="cover-image" data-slot="image" alt="" />
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="kicker"></p>
    <h1 class="display" data-slot="title"></h1>
    <p class="lead" data-slot="subtitle"></p>
  </div>
  <div class="meta">
    <div class="meta-item">
      <p class="meta-label">Cliente</p>
      <p class="meta-value" data-slot="client"></p>
    </div>
    <div class="meta-item">
      <p class="meta-label">Data</p>
      <p class="meta-value" data-slot="date"></p>
    </div>
    <div class="meta-item">
      <p class="meta-label">Preparato da</p>
      <p class="meta-value" data-slot="prepared_by"></p>
    </div>
  </div>
</div>
