<div class="frame comparison">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </header>
  <div class="body">
    <h2 class="title" data-slot="title"></h2>
    <div class="columns">
      <section class="column column-a">
        <p class="column-title" data-slot="left_title"></p>
        <ul class="column-items" data-slot="left">
          <li data-item></li>
        </ul>
      </section>
      <section class="column column-b">
        <p class="column-title" data-slot="right_title"></p>
        <ul class="column-items" data-slot="right">
          <li data-item></li>
        </ul>
      </section>
    </div>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="swipe" aria-hidden="true" data-fc-text="tap">Tap</span>
  </footer>
</div>
