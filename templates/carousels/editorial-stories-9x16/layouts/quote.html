<div class="frame quote">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </header>
  <div class="body">
    <span class="quote-mark" aria-hidden="true">“</span>
    <blockquote class="quote-text" data-slot="quote"></blockquote>
    <p class="author" data-slot="author"></p>
    <p class="author-role" data-slot="role"></p>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="swipe" aria-hidden="true" data-fc-text="tap">Tap</span>
  </footer>
</div>
