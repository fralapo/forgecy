<div class="frame cover-photo">
  <img class="photo-full" data-slot="image" alt="" />
  <div class="scrim scrim-top" aria-hidden="true"></div>
  <div class="scrim scrim-bottom" aria-hidden="true"></div>
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="kicker"></p>
    <h1 class="display" data-slot="title"></h1>
    <p class="lead" data-slot="subtitle"></p>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
