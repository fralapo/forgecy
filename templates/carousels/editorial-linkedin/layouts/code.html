<div class="frame code">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="kicker"></p>
    <h2 class="title" data-slot="title"></h2>
    <div class="code-card">
      <p class="code-lang" data-slot="language"></p>
      <div class="code-text" data-slot="code"></div>
    </div>
    <p class="code-note" data-slot="caption"></p>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
