<div class="frame problem-solution">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </header>
  <div class="body">
    <h2 class="title" data-slot="title"></h2>
    <section class="panel panel-problem">
      <p class="panel-label">Problema</p>
      <p class="panel-text" data-slot="problem"></p>
    </section>
    <section class="panel panel-solution">
      <p class="panel-label">Soluzione</p>
      <p class="panel-text" data-slot="solution"></p>
    </section>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="swipe" aria-hidden="true">Scorri</span>
  </footer>
</div>
