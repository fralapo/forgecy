<div class="frame takeaway">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="kicker"></p>
    <h2 class="title" data-slot="title"></h2>
    <p class="copy" data-slot="body"></p>
    <div class="takeaway-box">
      <p class="takeaway-label" data-fc-text="takeaway">In plain words</p>
      <p class="takeaway-text" data-slot="takeaway"></p>
    </div>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="swipe" aria-hidden="true" data-fc-text="swipe">Swipe</span>
  </footer>
</div>
