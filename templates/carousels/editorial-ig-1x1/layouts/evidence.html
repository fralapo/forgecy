<div class="frame evidence">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </header>
  <div class="body">
    <div class="evidence-card">
      <p class="evidence-top" data-slot="top"></p>
      <p class="evidence-body" data-slot="body"></p>
      <p class="evidence-note" data-slot="note"></p>
      <span class="evidence-circle" data-slot="detail"></span>
    </div>
    <p class="source" data-slot="source"></p>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="swipe" aria-hidden="true" data-fc-text="swipe">Swipe</span>
  </footer>
</div>
