<div class="frame cover">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="kicker"></p>
    <h1 class="display" data-slot="title"></h1>
    <p class="lead" data-slot="subtitle"></p>
  </div>
  <div class="meta">
    <div class="meta-item">
      <p class="meta-label" data-fc-text="version">Version</p>
      <p class="meta-value" data-slot="version"></p>
    </div>
    <div class="meta-item">
      <p class="meta-label" data-fc-text="date">Date</p>
      <p class="meta-value" data-slot="date"></p>
    </div>
    <div class="meta-item">
      <p class="meta-label" data-fc-text="preparedBy">Prepared by</p>
      <p class="meta-value" data-slot="prepared_by"></p>
    </div>
  </div>
</div>
