<div class="frame statement">

    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="tag" data-slot="label"></span>
  </header>
  <div class="body">
    <p class="big" data-slot="statement"></p>
