<div class="frame method">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
  </header>
  <div class="body">
    <h2 class="title" data-slot="title"></h2>
    <p class="copy" data-slot="intro"></p>
    <ul class="items" data-slot="items">
      <li><span class="item-text" data-item></span></li>
    </ul>
    <section class="panel">
      <p class="panel-label">Limitations</p>
      <p class="panel-text" data-slot="note"></p>
    </section>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
