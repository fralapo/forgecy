<div class="frame finding">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="tag" data-slot="severity"></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="label"></p>
    <h2 class="title" data-slot="title"></h2>
    <p class="copy" data-slot="description"></p>
    <section class="panel">
      <p class="panel-label">Evidence</p>
      <p class="panel-text" data-slot="evidence"></p>
      <img class="evidence-image" data-slot="evidence_image" alt="" />
    </section>
    <section class="panel panel-accent">
      <p class="panel-label">Recommendation</p>
      <p class="panel-text" data-slot="recommendation"></p>
    </section>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
