<div class="frame problem">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
  </header>
  <div class="body">
    <p class="kicker" data-slot="label"></p>
    <h2 class="title" data-slot="title"></h2>
    <p class="copy" data-slot="description"></p>
    <section class="panel panel-strong">
      <p class="panel-label">Impact</p>
      <p class="panel-text" data-slot="impact"></p>
    </section>
    <p class="list-label">Causes</p>
    <ul class="items" data-slot="causes">
      <li><span class="item-text" data-item></span></li>
    </ul>
  </div>
  <footer class="foot">
    <span class="handle" data-fc="handle"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
