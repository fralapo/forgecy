# Forgecy self-hosted stack. Start with: docker compose up -d
# Optional profiles: `dev` (Mailpit), `s3` (bundled S3 store), `https` (Caddy).
name: forgecy

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-forgecy}:${POSTGRES_PASSWORD:-forgecy}@postgres:5432/${POSTGRES_DB:-forgecy}
    REDIS_URL: redis://redis:6379
    MEDIA_ROOT: /data/media
    FORGECY_DATA_DIR: /data
    FORGECY_BASE_URL: ${FORGECY_BASE_URL:-http://localhost:3000}
    # Dates in the interface and in exports are shown in the agency's time zone.
    TZ: ${FORGECY_TIMEZONE:-Europe/Rome}

# Hardening, decided per service.
# - no-new-privileges on every service: no setuid binary or file capability can add privileges.
#   Entrypoints that start as root and drop with setuid()/su-exec/gosu are not affected.
# - cap_drop ALL on migrate, web and worker: they run as an unprivileged uid (node / 1000),
#   listen above 1024 and need no capability. Chromium in the worker runs with Playwright's
#   default --no-sandbox (chromiumSandbox is never enabled), so it needs neither SYS_ADMIN nor
#   user namespaces.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # Default capabilities kept: the entrypoint starts as root, chowns the data directory and
    # drops to postgres with gosu on first init (CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER).
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgecy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgecy}
      POSTGRES_DB: ${POSTGRES_DB:-forgecy}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Default capabilities kept: the entrypoint starts as root, chowns /data and drops to redis
    # with su-exec (CHOWN, SETUID, SETGID, DAC_OVERRIDE).
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Docker creates ./data as root; web and worker run as uid 1000 and write ./data/media.
  data-init:
    image: forgecy-migrate:local
    user: "0:0"
    # Root only to mkdir and chown ./data (created by Docker as root, or by another uid).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    command:
      [
        "sh",
        "-c",
        "mkdir -p /data/media && chown 1000:1000 /data && chown -R 1000:1000 /data/media",
      ]
    volumes:
      - ./data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  migrate:
    build: { context: ., dockerfile: docker/Dockerfile, target: migrate }
    image: forgecy-migrate:local
    <<: [*app-env, *hardened]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., dockerfile: docker/Dockerfile, target: web }
    image: forgecy-web:local
    restart: unless-stopped
    <<: [*app-env, *hardened]
    ports:
      - "${FORGECY_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    depends_on:
      data-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: worker }
    image: forgecy-worker:local
    restart: unless-stopped
    <<: [*app-env, *hardened]
    volumes:
      - ./data:/data
    depends_on:
      data-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  s3:
    image: chrislusf/seaweedfs:latest
    profiles: ["s3"]
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/entrypoint-forgecy.sh"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./docker/seaweedfs-entrypoint.sh:/entrypoint-forgecy.sh:ro
      - ./data/s3:/data
    ports:
      - "8333:8333"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    # The Caddyfile reads {$FORGECY_HOSTNAME}; without this the container never sees it.
    environment:
      FORGECY_HOSTNAME: ${FORGECY_HOSTNAME:-forgecy.local}
    # Runs as root: capabilities are dropped to NET_BIND_SERVICE (ports 80 and 443; the image
    # sets it as a file capability on /usr/bin/caddy, so it must stay in the bounding set) and
    # DAC_OVERRIDE (root must still write ./data/caddy, where `tls internal` creates its CA, and
    # read the Caddyfile when ./data or the file belong to the host user or are mode 600).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on: [web]
