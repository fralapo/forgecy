# Development services only (Postgres, Redis, Mailpit); run web and worker with `pnpm dev`.
# docker compose -f docker-compose.dev.yml up -d
name: forgecy-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: forgecy
      POSTGRES_PASSWORD: forgecy
      POSTGRES_DB: forgecy
    ports: ["5432:5432"]
    volumes: ["./data/dev-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgecy -d forgecy"]
      interval: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]
