<div class="frame typography">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="tag" data-slot="label"></span>
  </header>
  <div class="body">
    <h2 class="title" data-slot="title"></h2>
    <div class="faces">
      <section class="face face-heading">
        <p class="glyphs">Aa</p>
        <p class="face-name" data-slot="heading_family"></p>
        <p class="face-detail" data-slot="heading_detail"></p>
      </section>
      <section class="face face-body">
        <p class="glyphs">Aa</p>
        <p class="face-name" data-slot="body_family"></p>
        <p class="face-detail" data-slot="body_detail"></p>
      </section>
    </div>
    <section class="panel">
      <p class="sample-heading" data-slot="sample_heading"></p>
      <p class="sample-body" data-slot="sample_body"></p>
    </section>
  </div>
  <footer class="foot">
    <span class="footer" data-slot="footer"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
