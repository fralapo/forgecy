<div class="frame palette">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="tag" data-slot="label"></span>
  </header>
  <div class="body">
    <h2 class="title" data-slot="title"></h2>
    <p class="copy" data-slot="intro"></p>
    <div class="swatches">
      <figure class="swatch">
        <span class="chip chip-bg"></span>
        <figcaption data-slot="swatch_background"></figcaption>
      </figure>
      <figure class="swatch">
        <span class="chip chip-surface"></span>
        <figcaption data-slot="swatch_surface"></figcaption>
      </figure>
      <figure class="swatch">
        <span class="chip chip-text"></span>
        <figcaption data-slot="swatch_text"></figcaption>
      </figure>
      <figure class="swatch">
        <span class="chip chip-accent"></span>
        <figcaption data-slot="swatch_accent"></figcaption>
      </figure>
      <figure class="swatch">
        <span class="chip chip-cta"></span>
        <figcaption data-slot="swatch_cta"></figcaption>
      </figure>
    </div>
    <p class="list-label" data-fc-text="referencePalette">Reference palette</p>
    <ul class="items items-compact" data-slot="colors">
      <li><span class="item-text" data-item></span></li>
    </ul>
  </div>
  <footer class="foot">
    <span class="footer" data-slot="footer"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
