<div class="frame logo-page">
  <header class="chrome">
    <img class="logo" data-fc="logo" alt="" />
    <span class="brand" data-fc="brand-name"></span>
    <span class="tag" data-slot="label"></span>
  </header>
  <div class="body">
    <h2 class="title" data-slot="title"></h2>
    <p class="copy" data-slot="intro"></p>
    <div class="logo-stage">
      <img class="logo-hero" data-fc="logo" alt="" />
      <span class="logo-name" data-fc="brand-name"></span>
    </div>
    <div class="columns">
      <section class="column">
        <p class="column-label" data-fc-text="logoRules">How to use it</p>
        <ul class="items items-yes" data-slot="rules">
          <li><span class="item-text" data-item></span></li>
        </ul>
      </section>
      <section class="column column-no">
        <p class="column-label" data-fc-text="logoForbidden">Not allowed</p>
        <ul class="items items-no" data-slot="forbidden">
          <li><span class="item-text" data-item></span></li>
        </ul>
      </section>
    </div>
  </div>
  <footer class="foot">
    <span class="footer" data-slot="footer"></span>
    <span class="pager"
      ><span data-fc="page"></span><span class="sep">/</span><span data-fc="total"></span
    ></span>
  </footer>
</div>
